server.port=8080
server.servlet.session.cookie.same-site=strict

# PostgreSQL - create an empty database called ride_demand first
spring.datasource.url=jdbc:postgresql://localhost:5432/ride_demand
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

# let Hibernate create the tables, then data.sql fills in the placeholder areas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# python ML service
ml.service.url=http://localhost:8000

# how far around the driver we look (km)
demand.default-radius-km=5
demand.frontend-origin=http://localhost:5173
server.error.include-message=always
